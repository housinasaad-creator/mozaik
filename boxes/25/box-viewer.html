<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mozaik 3D — French Fry Scoop (Navy / Sky)</title>
  <link rel="stylesheet" href="../box.css?v=28" />
</head>
<body>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    "use strict";

    /* One continuous scoop shell (no face gaps). Decals for logo/stripes. */
    const NAVY = "#0f1f4a";
    const SKY  = "#5BB8E8";
    const WHITE = "#F7F7F5";

    const logoImg = new Image();
    logoImg.onload  = () => init(logoImg);
    logoImg.onerror = () => init(null);
    logoImg.src = "assets/mozaik-logo-white.png";

    function init(logo) {
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      var weak = (navigator.deviceMemory && navigator.deviceMemory <= 4)
        || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4)
        || matchMedia("(prefers-reduced-motion: reduce)").matches;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, weak ? 1 : 1.5));
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

      function fitToContainer() {
        const w = document.documentElement.clientWidth || innerWidth || 1280;
        const h = document.documentElement.clientHeight || innerHeight || 720;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      fitToContainer();
      if (window.ResizeObserver) new ResizeObserver(fitToContainer).observe(document.body);
      addEventListener("resize", fitToContainer);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x1a2438, 0.9));
      const key = new THREE.DirectionalLight(0xffffff, 0.7);
      key.position.set(3, 7, 5);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.32);
      fill.position.set(-4, 2, -2);
      scene.add(fill);

      function toTexture(c) {
        const t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return t;
      }

      function grain(x, w, h, s) {
        for (let i = 0; i < (w * h) / 1100; i++) {
          x.fillStyle = Math.random() > 0.5
            ? "rgba(255,255,255," + (Math.random() * 0.05 * s) + ")"
            : "rgba(0,0,0," + (Math.random() * 0.04 * s) + ")";
          x.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random(), 1 + Math.random());
        }
      }

      function makeTex(opts) {
        const W = opts.w || 1024, H = opts.h || 1024;
        const c = document.createElement("canvas");
        c.width = W; c.height = H;
        const x = c.getContext("2d");
        if (opts.transparent) {
          x.clearRect(0, 0, W, H);            // no background panel — decal shows logo/stripes only
        } else {
          x.fillStyle = NAVY;
          x.fillRect(0, 0, W, H);
          grain(x, W, H, 0.5);
        }
        if (opts.stripes) {
          const topY = 0.10, gap = 0.04, thick = Math.max(5, H * 0.02);
          x.strokeStyle = SKY;
          x.lineWidth = thick;
          x.lineCap = "round";
          for (let k = 0; k < 2; k++) {
            const yy = H * (topY + k * gap);
            x.beginPath();
            if (opts.curve === "u") {
              const r = H * 0.16 + k * H * 0.022;
              x.arc(W * 0.5, yy, r, Math.PI * 0.1, Math.PI * 0.9, false);
            } else if (opts.curve === "arch") {
              const rise = H * 0.07;
              x.moveTo(W * 0.06, yy + rise * 0.2);
              x.quadraticCurveTo(W * 0.5, yy - rise, W * 0.94, yy + rise * 0.2);
            } else {
              x.moveTo(W * 0.08, yy);
              x.lineTo(W * 0.92, yy);
            }
            x.stroke();
          }
        }
        if (opts.logo && logo && logo.naturalWidth) {
          const lw = W * (opts.logoScale || 0.38);
          const lh = lw * (logo.naturalHeight / logo.naturalWidth);
          x.globalAlpha = 0.92;
          x.drawImage(logo, (W - lw) / 2, H * (opts.logoY || 0.5) - lh / 2, lw, lh);
          x.globalAlpha = 1;
        }
        return toTexture(c);
      }

      function mapUVs(geo, x0, x1, y0, y1) {
        const uv = geo.attributes.uv, pos = geo.attributes.position;
        const dx = x1 - x0 || 1, dy = y1 - y0 || 1;
        for (let i = 0; i < uv.count; i++) {
          uv.setXY(i, (pos.getX(i) - x0) / dx, (pos.getY(i) - y0) / dy);
        }
        uv.needsUpdate = true;
      }

      /*
        Continuous perimeter shell — one mesh around the scoop.
        Logos/stripes are thin decals on top (don't create seams).
      */
      const W0 = 0.90, W1 = 1.34;
      const D  = 0.52;
      const HF = 1.55, HB = 2.10;
      const R  = W1 * 0.34;
      const G0 = 0.18, G1 = 0.28;
      const HCorner = HB - 0.10;
      const HPeak = HB;

      const texBody = makeTex({ w: 512, h: 512, stripes: false });
      const texF = makeTex({ w: 1024, h: 1200, stripes: false, logo: true, logoScale: 0.50, logoY: 0.58, transparent: true });
      const texB = makeTex({ w: 1024, h: 1500, stripes: true, curve: "arch", logo: true, logoScale: 0.52, logoY: 0.42 });
      const texS = makeTex({ w: 768, h: 1500, stripes: true });
      const texIn = (function () {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const x = c.getContext("2d");
        x.fillStyle = WHITE;
        x.fillRect(0, 0, 256, 256);
        grain(x, 256, 256, 0.28);
        return toTexture(c);
      })();

      const matBody = new THREE.MeshStandardMaterial({
        map: texBody, roughness: 0.85, metalness: 0.02,
        side: THREE.DoubleSide, flatShading: true
      });
      const matDecal = function (map) {
        return new THREE.MeshStandardMaterial({
          map: map, roughness: 0.82, metalness: 0.02, side: THREE.FrontSide,
          transparent: true, depthWrite: false,
          polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
        });
      };
      const matIn = new THREE.MeshStandardMaterial({
        color: new THREE.Color(WHITE), map: texIn, roughness: 0.95, metalness: 0,
        side: THREE.DoubleSide, flatShading: true
      });
      const matNavy = new THREE.MeshStandardMaterial({
        color: new THREE.Color(NAVY), roughness: 0.85, metalness: 0.02, side: THREE.DoubleSide
      });
      const matRim = new THREE.MeshStandardMaterial({
        color: new THREE.Color(NAVY), roughness: 0.82, metalness: 0.02, side: THREE.DoubleSide, flatShading: true
      });
      const matSky = new THREE.MeshBasicMaterial({
        color: new THREE.Color(SKY), side: THREE.FrontSide,
        polygonOffset: true, polygonOffsetFactor: -5, polygonOffsetUnits: -5,
        depthWrite: false
      });

      function faceFrom(pos, uv, idx, mat) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, mat);
      }

      function strip(cols, matOrMats, groups) {
        const nC = cols.length, nR = cols[0].length;
        const pos = [], uv = [], idx = [];
        for (let c = 0; c < nC; c++) {
          for (let r = 0; r < nR; r++) {
            const p = cols[c][r];
            pos.push(p[0], p[1], p[2]);
            /* Per-column U so each quarter can remap to a face texture */
            uv.push(c / (nC - 1), r / (nR - 1));
          }
        }
        for (let c = 0; c < nC - 1; c++) {
          for (let r = 0; r < nR - 1; r++) {
            const i0 = c * nR + r, i1 = (c + 1) * nR + r;
            const i2 = (c + 1) * nR + r + 1, i3 = c * nR + r + 1;
            idx.push(i0, i1, i2, i0, i2, i3);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        if (groups && groups.length) {
          for (let g = 0; g < groups.length; g++) {
            geo.addGroup(groups[g].start, groups[g].count, groups[g].materialIndex);
          }
        }
        return new THREE.Mesh(geo, matOrMats);
      }

      function wAt(t) { return (W0 + (W1 - W0) * t) * 0.5; }
      function gAt(t) { return G0 + (G1 - G0) * t; }

      function backRimY(nx) {
        const tt = (nx + 1) * 0.5;
        const y0 = HCorner, y1 = HPeak + 0.04, y2 = HCorner;
        const u = 1 - tt;
        return u * u * y0 + 2 * u * tt * y1 + tt * tt * y2;
      }

      function frontRimY(x) {
        const ax = Math.abs(x);
        if (ax >= R) return HF;
        return HF - Math.sqrt(Math.max(0, R * R - ax * ax));
      }

      /*
        Single parametric wall: u around perimeter [0,1], t up [0,1].
        Same function for every column → corners share exact positions.
      */
      function wallPoint(u, t, inset) {
        /* unwrap u into 4 equal spans: F, R, B, L */
        const seg = u * 4;
        const si = Math.min(3, Math.floor(seg));
        const f = seg - si;
        const w = Math.max(0.04, wAt(t) - inset);
        const g = gAt(t);
        const zF = D / 2 - inset;
        const zB = -D / 2 + inset;
        const yTrim = inset > 0 ? 0.05 : 0;
        let x, z, yMax;

        if (si === 0) {
          /* Front L → R */
          const nx = -1 + 2 * f;
          x = nx * w;
          z = zF;
          yMax = frontRimY(nx * wAt(1));
        } else if (si === 1) {
          /* Right F → crease → B */
          if (f <= 0.5) {
            const s = f / 0.5;
            x = w + g * s;
            z = zF * (1 - s);
            yMax = HF * (1 - s) + (HF * 0.48 + HCorner * 0.52) * s;
          } else {
            const s = (f - 0.5) / 0.5;
            x = w + g * (1 - s);
            z = zB * s;
            yMax = (HF * 0.48 + HCorner * 0.52) * (1 - s) + HCorner * s;
          }
        } else if (si === 2) {
          /* Back R → L */
          const nx = 1 - 2 * f;
          x = nx * w;
          z = zB;
          yMax = backRimY(nx);
        } else {
          /* Left B → crease → F */
          if (f <= 0.5) {
            const s = f / 0.5;
            x = -(w + g * s);
            z = zB * (1 - s);
            yMax = HCorner * (1 - s) + (HF * 0.48 + HCorner * 0.52) * s;
          } else {
            const s = (f - 0.5) / 0.5;
            x = -(w + g * (1 - s));
            z = zF * s;
            yMax = (HF * 0.48 + HCorner * 0.52) * (1 - s) + HF * s;
          }
        }
        const y = t * Math.max(0.04, yMax - yTrim);
        return [x, y, z];
      }

      const NROW = 22;

      /* Non-uniform perimeter: dense on front U-cut so the scoop curve is smooth */
      const LOOP_U = (function () {
        const u = [];
        for (let i = 0; i <= 96; i++) u.push((0.25 * i) / 96);           /* front — smooth U */
        for (let i = 1; i <= 28; i++) u.push(0.25 + (0.25 * i) / 28);     /* right */
        for (let i = 1; i <= 56; i++) u.push(0.5 + (0.25 * i) / 56);      /* back arch */
        for (let i = 1; i <= 28; i++) u.push(0.75 + (0.25 * i) / 28);     /* left */
        return u;
      })();

      function buildLoop(inset) {
        const cols = [];
        for (let c = 0; c < LOOP_U.length; c++) {
          const col = [];
          for (let r = 0; r <= NROW; r++) {
            col.push(wallPoint(LOOP_U[c], r / NROW, inset));
          }
          cols.push(col);
        }
        return cols;
      }

      const root = new THREE.Group();
      scene.add(root);

      const TH = 0.03;

      /* ONE continuous outer shell — no face seams */
      root.add(strip(buildLoop(0), matBody));

      /* ONE continuous white liner */
      root.add(strip(buildLoop(TH).slice().reverse(), matIn));

      /* Top + bottom rim bands — seal cardboard edge all the way around */
      function addBand(t) {
        const pos = [], uv = [], idx = [];
        const n = LOOP_U.length;
        for (let c = 0; c < n; c++) {
          const u = LOOP_U[c];
          const o = wallPoint(u, t, 0);
          const i = wallPoint(u, t, TH);
          pos.push(o[0], o[1], o[2], i[0], i[1], i[2]);
          uv.push(c / (n - 1), 0, c / (n - 1), 1);
        }
        for (let c = 0; c < n - 1; c++) {
          const a = c * 2, b = a + 1, d = a + 2, e = a + 3;
          idx.push(a, d, e, a, e, b);
        }
        root.add(faceFrom(pos, uv, idx, matRim));
      }
      addBand(1);
      addBand(0); /* bottom cardboard edge — seals base to walls */

      /* Floor — same outline as wall bottoms (incl. gusset), no leaks / no overhang */
      function footprintShape(inset) {
        const s = new THREE.Shape();
        const p0 = wallPoint(LOOP_U[0], 0, inset);
        s.moveTo(p0[0], p0[2]);
        for (let c = 1; c < LOOP_U.length; c++) {
          const p = wallPoint(LOOP_U[c], 0, inset);
          s.lineTo(p[0], p[2]);
        }
        s.closePath();
        return s;
      }
      const bottom = new THREE.Mesh(new THREE.ShapeGeometry(footprintShape(0)), matNavy);
      bottom.rotation.x = -Math.PI / 2;
      bottom.position.y = 0.002;
      root.add(bottom);

      const under = new THREE.Mesh(new THREE.ShapeGeometry(footprintShape(0)), matNavy);
      under.rotation.x = Math.PI / 2;
      under.position.y = -0.002;
      root.add(under);

      const fl = new THREE.Mesh(new THREE.ShapeGeometry(footprintShape(TH + 0.006)), matIn);
      fl.rotation.x = -Math.PI / 2;
      fl.position.y = 0.006;
      root.add(fl);

      /* Logo/stripe prints — inset from corners so they never split the shell */
      function frontPrint() {
        const s = new THREE.Shape();
        const a = W0 / 2 * 0.72, b = W1 / 2 * 0.72;
        const r = Math.min(R * 0.75, b * 0.7);
        const yTop = HF * 0.78;
        s.moveTo(-a, HF * 0.08); s.lineTo(a, HF * 0.08);
        s.lineTo(b, yTop); s.lineTo(r, yTop);
        for (let i = 0; i <= 72; i++) {
          const t = (i / 72) * Math.PI;
          s.lineTo(r * Math.cos(t), yTop - r * Math.sin(t));
        }
        s.lineTo(-b, yTop); s.closePath();
        const m = new THREE.Mesh(new THREE.ShapeGeometry(s, 72), matDecal(texF));
        mapUVs(m.geometry, -W1 / 2, W1 / 2, 0, HF);
        m.position.set(0, 0, D / 2 + 0.004);
        return m;
      }
      function backPrint() {
        const s = new THREE.Shape();
        const a = W0 / 2 * 0.72, b = W1 / 2 * 0.72;
        s.moveTo(-a, HCorner * 0.08); s.lineTo(a, HCorner * 0.08);
        s.lineTo(b, HCorner * 0.88);
        s.quadraticCurveTo(0, HPeak * 0.92, -b, HCorner * 0.88);
        s.closePath();
        const m = new THREE.Mesh(new THREE.ShapeGeometry(s, 32), matDecal(texB));
        mapUVs(m.geometry, -W1 / 2, W1 / 2, 0, HPeak + 0.04);
        m.position.set(0, 0, -D / 2 - 0.004);
        m.rotation.y = Math.PI;
        return m;
      }
      root.add(frontPrint());
      root.add(backPrint());

      /* Twin sky lines — flush on surface (no stick-out), even gap on U-curve */
      function stripePoint(u, drop) {
        const top = wallPoint(u, 1, 0);
        const seg = u * 4;
        const si = Math.min(3, Math.floor(seg + 1e-9));
        /* Front & back are flat panels: offset PERPENDICULAR to the rim curve (not
           straight down in Y) so the twin lines keep a constant gap even where the
           U-curve turns near-vertical at the corners. */
        if (si === 0 || si === 2) {
          const lo = si / 4, hi = (si + 1) / 4, eps = 0.0015;
          const a = wallPoint(Math.max(lo, u - eps), 1, 0);
          const b = wallPoint(Math.min(hi, u + eps), 1, 0);
          let tx = b[0] - a[0], ty = b[1] - a[1];
          const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
          let nx = ty, ny = -tx;                       // rim normal (in the flat face plane)
          const cy = (si === 0 ? HF : HPeak) + 0.3;    // opening centre sits above the cut
          if (nx * top[0] + ny * (top[1] - cy) < 0) { nx = -nx; ny = -ny; }  // point into the board
          return [top[0] + nx * drop, top[1] + ny * drop, top[2]];
        }
        /* Sides: stay on the folded surface */
        const t = Math.max(0.05, 1 - drop / Math.max(0.05, top[1]));
        return wallPoint(u, t, 0);
      }
      function rimStripe(dropLo, dropHi) {
        const samples = [];
        /* Extra-dense on front U-curve so the bend stays smooth */
        for (let i = 0; i <= 64; i++) samples.push((0.25 * i) / 64);
        for (let i = 1; i <= 20; i++) samples.push(0.25 + (0.25 * i) / 20);
        for (let i = 1; i <= 48; i++) samples.push(0.5 + (0.25 * i) / 48);
        for (let i = 1; i <= 20; i++) samples.push(0.75 + (0.25 * i) / 20);
        const cols = [];
        for (let c = 0; c < samples.length; c++) {
          const u = samples[c];
          cols.push([stripePoint(u, dropHi), stripePoint(u, dropLo)]);
        }
        return strip(cols, matSky);
      }
      root.add(rimStripe(0.050, 0.060));
      root.add(rimStripe(0.090, 0.100));

      root.position.y = -0.55;

      let dragging = false, px = 0, py = 0;
      let yaw = 0.6, pitch = 0.28, dist = 5.6;
      let autoSpin = true;
      const target = new THREE.Vector3(0, 0.7, 0);

      function onDown(e) {
        dragging = true;
        autoSpin = false;
        px = e.clientX; py = e.clientY;
        document.body.classList.add("grabbing");
      }
      function onUp() {
        dragging = false;
        autoSpin = true;
        document.body.classList.remove("grabbing");
      }
      function onMove(e) {
        if (!dragging) return;
        yaw -= (e.clientX - px) * 0.0065;
        pitch += (e.clientY - py) * 0.0055;
        /* Full orbit — nearly full sphere (avoid exact poles) */
        if (pitch > Math.PI / 2 - 0.05) pitch = Math.PI / 2 - 0.05;
        if (pitch < -Math.PI / 2 + 0.05) pitch = -Math.PI / 2 + 0.05;
        px = e.clientX; py = e.clientY;
      }
      renderer.domElement.addEventListener("pointerdown", onDown);
      addEventListener("pointerup", onUp);
      addEventListener("pointermove", onMove);
      renderer.domElement.addEventListener("wheel", function (e) {
        dist = Math.max(2.8, Math.min(12, dist + e.deltaY * 0.004));
      }, { passive: true });

      /* ---- pinch-to-zoom (2-finger touch) — single-finger drag-to-rotate above already
         works via Pointer Events, this only adds the missing mobile zoom gesture ---- */
      let pinchDist = 0;
      const touchDist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      renderer.domElement.addEventListener("touchstart", function (e) {
        if (e.touches.length === 2) {
          dragging = false;
          document.body.classList.remove("grabbing");
          pinchDist = touchDist(e.touches[0], e.touches[1]);
        }
      }, { passive: true });
      renderer.domElement.addEventListener("touchmove", function (e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          const d = touchDist(e.touches[0], e.touches[1]);
          if (pinchDist > 0) dist = Math.max(2.8, Math.min(12, dist + (pinchDist - d) * 0.015));
          pinchDist = d;
        }
      }, { passive: false });
      renderer.domElement.addEventListener("touchend", function (e) {
        if (e.touches.length < 2) pinchDist = 0;
      }, { passive: true });

      (function frame() {
        if (autoSpin && !dragging) yaw += 0.0042;
        camera.position.set(
          target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
          target.y + Math.sin(pitch) * dist,
          target.z + Math.cos(yaw) * Math.cos(pitch) * dist
        );
        camera.lookAt(target);
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      })();
    }
  </script>
</body>
</html>
