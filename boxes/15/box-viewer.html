<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mozaik 3D Kutu Görüntüleyicisi — Sıcak Yaldız (Altı Köşe)</title>
  <link rel="stylesheet" href="../box.css?v=28" />
</head>
<body>

  <div class="fold-ctrl" id="foldCtrl">
    <span class="lbl" id="lblOpen">Open</span>
    <input type="range" id="foldSlider" min="0" max="1" step="0.001" value="0.22" />
    <span class="lbl" id="lblClose">Close</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    "use strict";

    /* ---------- palette: six-corner mailer shape + Hot Foil colours ----------
       navy exterior (incl. lid), white interior, gold foil Mozaik mark */
    const WHITE = "#f4f3ef";
    const NAVY  = "#141a30";
    const GOLD  = "#c9a05f";       // foil albedo — shine comes from LIVE reflections, not a baked sheen
    const CYAN  = NAVY;   // former cyan faces → navy
    const PINK  = NAVY;   // former pink ends → navy
    const ACCENT = "#e8eef8"; // light shapes on navy ends (readable)

    let logoColored = null, logoWhite = null, logoGold = null, toLoad = 2;
    function ready() { if (--toLoad === 0) init(); }
    const li1 = new Image(); li1.onload = () => { logoColored = li1; ready(); }; li1.onerror = ready; li1.src = "assets/mozaik-logo-colored.png";
    const li2 = new Image(); li2.onload = () => { logoWhite = li2; ready(); }; li2.onerror = ready; li2.src = "assets/mozaik-logo-white.png";

    function tintLogoGold(src) {
      if (!src || !(src.naturalWidth || src.width)) return null;
      const LOGO_KEEP = 0.811; // crop "OFSET VE AMBALAJ" subtitle
      const cc = document.createElement("canvas");
      cc.width = src.naturalWidth || src.width;
      cc.height = Math.round((src.naturalHeight || src.height) * LOGO_KEEP);
      cc.getContext("2d").drawImage(src, 0, 0);
      const gc = document.createElement("canvas");
      gc.width = cc.width; gc.height = cc.height;
      const gx = gc.getContext("2d");
      gx.drawImage(cc, 0, 0);
      gx.globalCompositeOperation = "source-in";
      gx.fillStyle = GOLD; gx.fillRect(0, 0, gc.width, gc.height);
      gc.naturalWidth = gc.width; gc.naturalHeight = gc.height;
      return gc;
    }

    function init() {
      logoGold = tintLogoGold(logoColored || logoWhite);
      console.log("init, logos:",!!logoColored,!!logoWhite,!!logoGold);

      /* ---------- renderer ---------- */
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      var __mzkWeak = (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || matchMedia("(prefers-reduced-motion: reduce)").matches;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, __mzkWeak ? 1 : 1.25));  // weak=1x; strong capped at 1.25 (foil box is GPU-heavy)
      renderer.shadowMap.enabled = false;   // ground shadow removed (perf: no shadow-map pass)
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      // HDRI-grade tone mapping → richer highlights on the gold foil
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = null;

      /* ---------- HDRI studio — SHARP strip lights (not soft blobs)
         so foil highlights visibly SLIDE across the logo as you drag/rotate ---------- */
      (function () {
        const EW = 512, EH = 256; // half-res HDRI — enough for foil slides, cheaper PMREM
        const ec = document.createElement("canvas"); ec.width = EW; ec.height = EH;
        const ex = ec.getContext("2d");
        ex.fillStyle = "#050608"; ex.fillRect(0, 0, EW, EH);
        const g = ex.createLinearGradient(0, 0, 0, EH * 0.35);
        g.addColorStop(0, "#3a4254"); g.addColorStop(1, "rgba(5,6,8,0)");
        ex.fillStyle = g; ex.fillRect(0, 0, EW, EH * 0.35);
        function strip(x, y, w, h, col) {
          ex.fillStyle = col;
          ex.fillRect(x, y, w, h);
          const rg = ex.createLinearGradient(x, y, x + w, y);
          rg.addColorStop(0, "rgba(0,0,0,0.55)"); rg.addColorStop(0.15, "rgba(0,0,0,0)");
          rg.addColorStop(0.85, "rgba(0,0,0,0)"); rg.addColorStop(1, "rgba(0,0,0,0.55)");
          ex.fillStyle = rg; ex.fillRect(x, y, w, h);
        }
        const sx = EW / 1024, sy = EH / 512;
        strip(160 * sx, 36 * sy, 220 * sx, 28 * sy, "#ffffff");
        strip(620 * sx, 55 * sy, 160 * sx, 22 * sy, "#f4f7ff");
        strip(380 * sx, 18 * sy, 260 * sx, 18 * sy, "#ffffff");
        strip(80 * sx, 120 * sy, 90 * sx, 90 * sy, "#ffe6b0");
        strip(860 * sx, 110 * sy, 70 * sx, 70 * sy, "#dce6ff");
        strip(450 * sx, 200 * sy, 140 * sx, 16 * sy, "#fff6e0");
        const et = new THREE.CanvasTexture(ec);
        et.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        scene.environment = pmrem.fromEquirectangular(et).texture;
        et.dispose(); pmrem.dispose();
      })();

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
      camera.position.set(0, 3.0, 7.6);
      camera.lookAt(0, 0.1, 0);

      function fitToContainer() {
        const w = document.documentElement.clientWidth || innerWidth || 1280;
        const h = document.documentElement.clientHeight || innerHeight || 720;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      fitToContainer();
      if (window.ResizeObserver) new ResizeObserver(fitToContainer).observe(document.body);
      addEventListener("resize", fitToContainer);

      /* ---------- lighting — form + a tight specular that MOVES as you drag ---------- */
      scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2d38, 0.42));

      const key = new THREE.DirectionalLight(0xffffff, 0.55);
      key.position.set(4, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 1; key.shadow.camera.far = 30;
      key.shadow.camera.left = key.shadow.camera.bottom = -8;
      key.shadow.camera.right = key.shadow.camera.top = 8;
      key.shadow.bias = -0.0004;
      key.shadow.radius = 7;
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xcfe0ff, 0.22);
      fill.position.set(-5, 3, -4);
      scene.add(fill);

      // one warm skim (rim+spark merged) — fewer lights, foil still slides via env
      const rim = new THREE.DirectionalLight(0xffe6b8, 0.95);
      rim.position.set(-2.5, 6.5, -4);
      scene.add(rim);

      /* ---------- helpers ---------- */
      function toTexture(c) {
        const t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return t;
      }

      /* SOFT paper grain — lighter than the previous boxes (per request) */
      function paperGrain(x, w, h, strength) {
        const s = (strength == null? 1 : strength) * 0.5; // half strength = softer
        for (let i = 0; i < w * h / 900; i++) {
          const light = Math.random() > 0.5;
          x.fillStyle = light
           ? "rgba(255,255,255," + (Math.random() * 0.07 * s) + ")"
            : "rgba(80,70,55," + (Math.random() * 0.05 * s) + ")";
          x.fillRect(Math.random() * w, Math.random() * h, 1.4 + Math.random() * 1.4, 1.4 + Math.random() * 1.4);
        }
        for (let i = 0; i < 22; i++) {
          const mx = Math.random() * w, my = Math.random() * h;
          const mr = 40 + Math.random() * 90;
          const g = x.createRadialGradient(mx, my, 0, mx, my, mr);
          const dark = Math.random() > 0.5;
          g.addColorStop(0, dark? "rgba(60,55,45," + (0.03 * s) + ")" : "rgba(255,255,255," + (0.035 * s) + ")");
          g.addColorStop(1, "rgba(0,0,0,0)");
          x.fillStyle = g;
          x.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
        }
      }

      const bumpTex = (function () {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, 512, 512);
        const d = x.getImageData(0, 0, 512, 512);
        for (let i = 0; i < d.data.length; i += 4) {
          const n = 128 + (Math.random() - 0.5) * 18; // gentler bump
          d.data[i] = d.data[i + 1] = d.data[i + 2] = n;
        }
        x.putImageData(d, 0, 0);
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 3);
        return t;
      })();

      function plainPanel(w, h, base, strength) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const x = c.getContext("2d");
        x.fillStyle = base;
        x.fillRect(0, 0, w, h);
        paperGrain(x, w, h, strength == null? 1 : strength);
        return toTexture(c);
      }

      /* a panel with the Mozaik logo pasted exactly as supplied (centered),
         choosing the white or the colored artwork to read on the given bg */
      function logoPanelTexture(wPx, hPx, base, frac, useWhite, rot, keepFrac) {
        const c = document.createElement("canvas");
        c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        x.fillStyle = base;
        x.fillRect(0, 0, wPx, hPx);
        // gold foil mark on navy/white faces; white logo only when explicitly requested
        let logo = useWhite
          ? (logoWhite || logoGold || logoColored)
          : (logoGold || logoColored || logoWhite);
        // keepFrac < 1 → crop away the bottom of the logo art (the "OFSET VE AMBALAJ" subtitle line)
        // logoGold is already cropped; only crop raw image sources
        if (logo && keepFrac && keepFrac < 1 && logo.naturalWidth && logo !== logoGold) {
          const cc = document.createElement("canvas");
          cc.width = logo.naturalWidth;
          cc.height = Math.round(logo.naturalHeight * keepFrac);
          cc.getContext("2d").drawImage(logo, 0, 0);
          logo = cc;   // canvas: use .width/.height below
        }
        if (logo) {
          x.save();
          x.translate(wPx / 2, hPx / 2);
          if (rot) x.rotate(rot);
          const lgW = logo.naturalWidth || logo.width, lgH = logo.naturalHeight || logo.height;
          const ratio = lgH / lgW;
          const lw = Math.round(wPx * frac);
          const lh = Math.round(lw * ratio);
          x.drawImage(logo, -lw / 2, -lh / 2, lw, lh);
          x.restore();
        }
        paperGrain(x, wPx, hPx, 0.5);
        return toTexture(c);
      }

      /* matte gold geometric ornaments on navy side panels — order matches reference:
         diamond · chevrons↓ · square · circles · star · triangle↓
         (flat printed gold — no foil / metal / gloss) */
      const ORN_GOLD = "#b8954a";
      function drawWhiteShapeRow(x, wPx, hPx, cy, r) {
        x.strokeStyle = ORN_GOLD; x.fillStyle = ORN_GOLD;
        x.lineWidth = Math.max(2.5, wPx * 0.0045);
        x.lineJoin = "round"; x.lineCap = "round";
        const kinds = [0, 1, 2, 3, 4, 5]; // fixed order L→R
        const gap = wPx / (kinds.length + 1);
        for (let i = 0; i < kinds.length; i++) {
          const cx = gap * (i + 1), kind = kinds[i];
          x.save(); x.translate(cx, cy);
          if (kind === 0) { // diamond
            x.beginPath(); x.moveTo(0, -r); x.lineTo(r, 0); x.lineTo(0, r); x.lineTo(-r, 0); x.closePath(); x.stroke();
          } else if (kind === 1) { // triple chevrons pointing down
            for (let k = -1; k <= 1; k++) {
              const oy = k * r * 0.42;
              x.beginPath();
              x.moveTo(-r, oy - r * 0.35); x.lineTo(0, oy + r * 0.4); x.lineTo(r, oy - r * 0.35);
              x.stroke();
            }
          } else if (kind === 2) { // plain square
            x.strokeRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7);
          } else if (kind === 3) { // concentric circles
            x.beginPath(); x.arc(0, 0, r, 0, 7); x.stroke();
            x.beginPath(); x.arc(0, 0, r * 0.52, 0, 7); x.stroke();
          } else if (kind === 4) { // five-point star
            x.beginPath();
            for (let k = 0; k < 10; k++) {
              const rad = k % 2 ? r * 0.42 : r;
              const a = -Math.PI / 2 + k * Math.PI / 5;
              x.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
            }
            x.closePath(); x.stroke();
          } else { // triangle pointing down
            x.beginPath(); x.moveTo(-r, -r * 0.75); x.lineTo(r, -r * 0.75); x.lineTo(0, r); x.closePath(); x.stroke();
          }
          x.restore();
        }
      }
      function strokeWhiteDoubleFrame(x, w, h) {
        const m1 = Math.round(Math.min(w, h) * 0.07);
        const m2 = Math.round(Math.min(w, h) * 0.12);
        x.strokeStyle = ORN_GOLD;
        x.lineWidth = Math.max(2, Math.round(Math.min(w, h) * 0.012));
        x.strokeRect(m1, m1, w - m1 * 2, h - m1 * 2);
        x.lineWidth = Math.max(1.5, Math.round(Math.min(w, h) * 0.009));
        x.strokeRect(m2, m2, w - m2 * 2, h - m2 * 2);
      }
      /* navy end / side face: white double frame + white shape row */
      function sideOrnamentTexture(wPx, hPx) {
        const c = document.createElement("canvas");
        c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        x.fillStyle = NAVY;
        x.fillRect(0, 0, wPx, hPx);
        strokeWhiteDoubleFrame(x, wPx, hPx);
        drawWhiteShapeRow(x, wPx, hPx, hPx * 0.5, hPx * 0.14);
        paperGrain(x, wPx, hPx, 0.45);
        return toTexture(c);
      }

      /* ---------- lid-only gold foil: rounded-square rim (glossy metal) ---------- */
      const FOIL_LINE = "#d4af6e";
      function strokeGoldRoundFrame(x, w, h) {
        const inset = Math.round(Math.min(w, h) * 0.05);
        const lineW = Math.max(6, Math.round(Math.min(w, h) * 0.028));
        const rad = Math.round(Math.min(w, h) * 0.07);
        const fx = inset, fy = inset, fw = w - inset * 2, fh = h - inset * 2;
        const r = Math.min(rad, fw / 2, fh / 2);
        x.strokeStyle = FOIL_LINE;
        x.lineWidth = lineW;
        x.lineJoin = "round";
        x.beginPath();
        x.moveTo(fx + r, fy);
        x.arcTo(fx + fw, fy, fx + fw, fy + fh, r);
        x.arcTo(fx + fw, fy + fh, fx, fy + fh, r);
        x.arcTo(fx, fy + fh, fx, fy, r);
        x.arcTo(fx, fy, fx + fw, fy, r);
        x.closePath();
        x.stroke();
      }
      /* navy lid top: single glossy gold rounded frame (no corner نقوش) */
      function navyLidFrameMaps(wPx, hPx) {
        const base = document.createElement("canvas"); base.width = wPx; base.height = hPx;
        const bx = base.getContext("2d");
        bx.fillStyle = NAVY; bx.fillRect(0, 0, wPx, hPx);
        strokeGoldRoundFrame(bx, wPx, hPx);
        paperGrain(bx, wPx, hPx, 0.4);

        const rgh = document.createElement("canvas"); rgh.width = wPx; rgh.height = hPx;
        const rx = rgh.getContext("2d");
        rx.fillStyle = "#ffffff"; rx.fillRect(0, 0, wPx, hPx);
        const met = document.createElement("canvas"); met.width = wPx; met.height = hPx;
        const mtx = met.getContext("2d");
        mtx.fillStyle = "#000000"; mtx.fillRect(0, 0, wPx, hPx);
        // gold pixels → glossy metal foil
        const id = bx.getImageData(0, 0, wPx, hPx);
        const rd = rx.getImageData(0, 0, wPx, hPx);
        const md = mtx.getImageData(0, 0, wPx, hPx);
        for (let i = 0; i < id.data.length; i += 4) {
          const r = id.data[i], g = id.data[i + 1], b = id.data[i + 2];
          if (r > 130 && g > 95 && b < 160 && r > b + 25) {
            rd.data[i] = rd.data[i + 1] = rd.data[i + 2] = 18;
            md.data[i] = md.data[i + 1] = md.data[i + 2] = 245;
          }
        }
        rx.putImageData(rd, 0, 0); mtx.putImageData(md, 0, 0);
        const dataTex = (c) => {
          const t = new THREE.CanvasTexture(c);
          t.encoding = THREE.LinearEncoding;
          t.generateMipmaps = false;
          t.minFilter = THREE.LinearFilter;
          t.magFilter = THREE.LinearFilter;
          t.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return t;
        };
        return { map: toTexture(base), rough: dataTex(rgh), metal: dataTex(met) };
      }

      /* inside-of-lid: white + gold logo + a small "OPEN" tab mark */
      function lidInnerTexture(wPx, hPx) {
        const c = document.createElement("canvas");
        c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        x.fillStyle = WHITE;
        x.fillRect(0, 0, wPx, hPx);
        
        const logo = logoGold || logoColored || logoWhite;
        if (logo) {
          const lgW = logo.naturalWidth || logo.width, lgH = logo.naturalHeight || logo.height;
          const ratio = lgH / lgW;
          const lw = Math.round(wPx * 0.36);
          const lh = Math.round(lw * ratio);
          // رفعنا الشعار لفوق: 0.22 بدل 0.30 عشان يصير فوق الفتحة
          x.drawImage(logo, (wPx - lw) / 2, hPx * 0.22 - lh / 2, lw, lh);
        }
        // OPEN pill near the front edge — navy with white type
        x.fillStyle = NAVY;
        const pw = wPx * 0.16, ph = hPx * 0.09, px = (wPx - pw) / 2, py = hPx * 0.52;
        x.beginPath();
        const rr = ph / 2;
        x.moveTo(px + rr, py); x.lineTo(px + pw - rr, py);
        x.arc(px + pw - rr, py + rr, rr, -Math.PI / 2, Math.PI / 2);
        x.lineTo(px + rr, py + ph); x.arc(px + rr, py + rr, rr, Math.PI / 2, Math.PI * 1.5);
        x.closePath(); x.fill();
        x.fillStyle = "#ffffff"; x.font = "bold " + Math.round(ph * 0.62) + "px sans-serif";
        x.textAlign = "center"; x.textBaseline = "middle";
        x.fillText("OPEN", wPx / 2, py + ph / 2 + 1);
        
        paperGrain(x, wPx, hPx, 0.4);
        return toTexture(c);
      }

      /* interior white face of the long walls, with a diagonal GLUE crease
         drawn at each end corner — marks where the corner flap is glued
         (same idea as the four/six-corner box) */
      function creasedInnerTexture(wPx, hPx, wallLen) {
        const c = document.createElement("canvas");
        c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        x.fillStyle = WHITE;
        x.fillRect(0, 0, wPx, hPx);
        const triW = wPx * (BOX_H / wallLen); // 45° crease spanning the wall height
        [[0, 1], [wPx, -1]].forEach(([x0, dir]) => {
          // faint shading over the glued corner triangle
          x.fillStyle = "rgba(70,72,80,0.05)";
          x.beginPath(); x.moveTo(x0, 0); x.lineTo(x0 + dir * triW, hPx); x.lineTo(x0, hPx); x.closePath(); x.fill();
          // the crease line itself
          x.strokeStyle = "rgba(90,94,104,0.5)";
          x.lineWidth = Math.max(2, wPx * 0.0025);
          x.beginPath(); x.moveTo(x0, 0); x.lineTo(x0 + dir * triW, hPx); x.stroke();
        });
        paperGrain(x, wPx, hPx, 0.4);
        return toTexture(c);
      }

      const cardMat = (map) => new THREE.MeshStandardMaterial({
        map, metalness: 0.0, roughness: 0.85, bumpMap: bumpTex, bumpScale: 0.008,
        envMapIntensity: 0.0, side: THREE.FrontSide   // opaque boards — skip back-face shading
      });

      /* foil panel: navy board + GOLD metallic-glossy Mozaik mark (from old Hot Foil).
         roughness/metalness maps gate the shine to the mark only. */
      const logoArt = logoGold; // already cropped + gold-tinted
      function foilPanelMaps(wPx, hPx, frac, baseHex, doGrain, doBump) {
        const base = document.createElement("canvas"); base.width = wPx; base.height = hPx;
        const bx = base.getContext("2d");
        bx.fillStyle = baseHex || NAVY; bx.fillRect(0, 0, wPx, hPx);

        const rgh = document.createElement("canvas"); rgh.width = wPx; rgh.height = hPx;
        const rx = rgh.getContext("2d");
        rx.fillStyle = "#ffffff"; rx.fillRect(0, 0, wPx, hPx);   // board fully matte

        const met = document.createElement("canvas"); met.width = wPx; met.height = hPx;
        const mtx = met.getContext("2d");
        mtx.fillStyle = "#000000"; mtx.fillRect(0, 0, wPx, hPx); // dielectric board

        if (doGrain !== false) paperGrain(bx, wPx, hPx, 0.55);

        let bmp = null, bpx = null;
        if (doBump) {
          bmp = document.createElement("canvas"); bmp.width = wPx; bmp.height = hPx;
          bpx = bmp.getContext("2d");
          bpx.fillStyle = "#808080"; bpx.fillRect(0, 0, wPx, hPx);
          const id = bpx.getImageData(0, 0, wPx, hPx);
          for (let i = 0; i < id.data.length; i += 4) {
            const n = 128 + (Math.random() - 0.5) * 34;
            id.data[i] = id.data[i + 1] = id.data[i + 2] = n;
          }
          bpx.putImageData(id, 0, 0);
        }

        if (logoArt) {
          const lgW = logoArt.naturalWidth || logoArt.width;
          const lgH = logoArt.naturalHeight || logoArt.height;
          const ratio = lgH / lgW;
          const lw = Math.round(wPx * frac);
          const lh = Math.round(lw * ratio);
          const stencil = (col) => {
            const s = document.createElement("canvas");
            s.width = lgW; s.height = lgH;
            const sx = s.getContext("2d");
            sx.drawImage(logoArt, 0, 0);
            sx.globalCompositeOperation = "source-in";
            sx.fillStyle = col; sx.fillRect(0, 0, s.width, s.height);
            return s;
          };
          const px = (wPx - lw) / 2, py = (hPx - lh) / 2;
          bx.drawImage(logoArt, px, py, lw, lh);
          rx.drawImage(stencil("#0a0a0a"), px, py, lw, lh);  // mirror-gloss foil — highlights travel when you drag
          mtx.drawImage(stencil("#ffffff"), px, py, lw, lh); // full metal
          if (bpx) bpx.drawImage(stencil("#808080"), px, py, lw, lh);
        }
        // colour = sRGB; roughness/metalness = linear data (no mip blur → crisp foil edge)
        const dataTex = (c) => {
          const t = new THREE.CanvasTexture(c);
          t.encoding = THREE.LinearEncoding;
          t.generateMipmaps = false;
          t.minFilter = THREE.LinearFilter;
          t.magFilter = THREE.LinearFilter;
          t.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return t;
        };
        const out = { map: toTexture(base), rough: dataTex(rgh), metal: dataTex(met) };
        if (bmp) {
          const bt = new THREE.CanvasTexture(bmp);
          bt.encoding = THREE.LinearEncoding;
          bt.generateMipmaps = false;
          bt.minFilter = THREE.LinearFilter;
          bt.anisotropy = renderer.capabilities.getMaxAnisotropy();
          out.bump = bt;
        }
        return out;
      }

      /* lock-tab foil maps — same gold recipe, UV-flipped like tabLogoTexture */
      function foilTabMaps(wPx, hPx) {
        const base = document.createElement("canvas"); base.width = wPx; base.height = hPx;
        const bx = base.getContext("2d");
        bx.fillStyle = NAVY; bx.fillRect(0, 0, wPx, hPx);
        const rgh = document.createElement("canvas"); rgh.width = wPx; rgh.height = hPx;
        const rx = rgh.getContext("2d");
        rx.fillStyle = "#ffffff"; rx.fillRect(0, 0, wPx, hPx);
        const met = document.createElement("canvas"); met.width = wPx; met.height = hPx;
        const mtx = met.getContext("2d");
        mtx.fillStyle = "#000000"; mtx.fillRect(0, 0, wPx, hPx);
        if (logoArt) {
          const lgW = logoArt.naturalWidth || logoArt.width;
          const lgH = logoArt.naturalHeight || logoArt.height;
          const ratio = lgH / lgW;
          const lw = Math.round(wPx * 0.24), lh = Math.round(lw * ratio);
          const stencil = (col) => {
            const s = document.createElement("canvas");
            s.width = lgW; s.height = lgH;
            const sx = s.getContext("2d");
            sx.drawImage(logoArt, 0, 0);
            sx.globalCompositeOperation = "source-in";
            sx.fillStyle = col; sx.fillRect(0, 0, s.width, s.height);
            return s;
          };
          const place = (ctx, img) => {
            ctx.save();
            ctx.translate(wPx / 2, hPx * 0.8);
            ctx.scale(1, -1);
            ctx.drawImage(img, -lw / 2, -lh / 2, lw, lh);
            ctx.restore();
          };
          place(bx, logoArt);
          place(rx, stencil("#0a0a0a"));
          place(mtx, stencil("#ffffff"));
        }
        paperGrain(bx, wPx, hPx, 0.4);
        const dataTex = (c) => {
          const t = new THREE.CanvasTexture(c);
          t.encoding = THREE.LinearEncoding;
          t.generateMipmaps = false;
          t.minFilter = THREE.LinearFilter;
          t.magFilter = THREE.LinearFilter;
          t.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return t;
        };
        return { map: toTexture(base), rough: dataTex(rgh), metal: dataTex(met) };
      }

      const foilMat = (maps) => {
        // LIVE foil: metalness/roughness maps + studio env → shine moves as you drag the box
        const m = new THREE.MeshStandardMaterial({
          map: maps.map, roughnessMap: maps.rough, metalnessMap: maps.metal,
          bumpMap: maps.bump || null, bumpScale: maps.bump ? 0.02 : 0,
          metalness: 1.0, roughness: 1.0, envMapIntensity: 3.6, side: THREE.FrontSide
        });
        if (scene.environment) m.envMap = scene.environment;
        return m;
      };

      /* Foil DECAL — metal mark + a LIVE sheen band driven by box rotation.
         Drag/rotate → highlight slides across the logo (the interaction you asked for). */
      const foilDecals = [];
      function makeFoilDecal(parentW, frac) {
        if (!logoArt) return null;
        const lgW = logoArt.naturalWidth || logoArt.width;
        const lgH = logoArt.naturalHeight || logoArt.height;
        // immutable gold stamp (alpha preserved)
        const stamp = document.createElement("canvas");
        stamp.width = lgW; stamp.height = lgH;
        stamp.getContext("2d").drawImage(logoArt, 0, 0);
        // working canvas — redrawn every frame with moving specular band
        const c = document.createElement("canvas");
        c.width = lgW; c.height = lgH;
        const map = toTexture(c);
        const mat = new THREE.MeshStandardMaterial({
          map, transparent: true, alphaTest: 0.12,
          metalness: 1.0, roughness: 0.08,
          envMapIntensity: 3.8,
          depthWrite: false, side: THREE.FrontSide
        });
        if (scene.environment) mat.envMap = scene.environment;
        const worldW = parentW * frac;
        const worldH = worldW * (lgH / lgW);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldH), mat);
        mesh.userData.foilPaint = function (rx, ry) {
          const x = c.getContext("2d");
          x.clearRect(0, 0, lgW, lgH);
          x.globalCompositeOperation = "source-over";
          x.drawImage(stamp, 0, 0);
          // sheen follows drag — warm gold only (no white hot-spot in the mark)
          const t = ((ry * 0.28 + rx * 0.4) % 1 + 1) % 1;
          x.globalCompositeOperation = "source-atop";
          const g = x.createLinearGradient(lgW * (t - 0.55), 0, lgW * (t + 0.55), lgH);
          g.addColorStop(0.28, "rgba(180,130,60,0)");
          g.addColorStop(0.42, "rgba(212,170,90,0.12)");
          g.addColorStop(0.50, "rgba(240,205,130,0.42)");
          g.addColorStop(0.58, "rgba(212,170,90,0.12)");
          g.addColorStop(0.72, "rgba(180,130,60,0)");
          x.fillStyle = g;
          x.fillRect(0, 0, lgW, lgH);
          map.needsUpdate = true;
        };
        mesh.userData.foilPaint(0.36, Math.PI / 6);
        foilDecals.push(mesh);
        return mesh;
      }

      function normalizeUVs(geo) {
        const uv = geo.attributes.uv;
        let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
        for (let i = 0; i < uv.count; i++) {
          minU = Math.min(minU, uv.getX(i)); maxU = Math.max(maxU, uv.getX(i));
          minV = Math.min(minV, uv.getY(i)); maxV = Math.max(maxV, uv.getY(i));
        }
        const su = maxU - minU || 1, sv = maxV - minV || 1;
        for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) - minU) / su, (uv.getY(i) - minV) / sv);
        uv.needsUpdate = true;
        return geo;
      }

      /* the wide front lock tab, with a semicircular FINGER NOTCH die-cut from
         its free (far) edge — authored flat then oriented like the box tab */
      function notchedTabGeometry(w, len, thick, R) {
        const shape = new THREE.Shape();
        shape.moveTo(-w / 2, 0);
        shape.lineTo(w / 2, 0);
        shape.lineTo(w / 2, len);
        shape.lineTo(R, len);
        shape.absarc(0, len, R, 0, Math.PI, true); // semicircle dipping INTO the tab
        shape.lineTo(-w / 2, len);
        shape.closePath();
        const geo = normalizeUVs(new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false, curveSegments: 10 }));
        geo.rotateX(Math.PI / 2); // shape length → +z, extrude → -y thickness
        geo.translate(0, thick / 2, 0); // center the thickness
        return geo;
      }

      /* =========================================================
         GEOMETRY — six-corner mailer shape (from box 7) with Hot Foil
         colours: navy exterior, white lid + interior, gold foil logo.
         Slider controls ONLY the top lid open/close.
         ========================================================= */
      const BOX_W = 3.0, BOX_D = 2.0, BOX_H = 0.62, T = 0.02, FLOOR_T = 0.02;

      const trayGroup = new THREE.Group();

      const whiteTex = plainPanel(512, 512, WHITE, 0.5);
      const navyTex = plainPanel(512, 512, NAVY, 0.5);
      // gold on lid rim + logos; ornaments — half-res maps (big FPS/VRAM win)
      const lidTopMaps = navyLidFrameMaps(700, 450);   // upper lid — rounded gold frame only
      const tabMaps = foilTabMaps(700, 150); // lock tab + gold foil logo
      const sideOrnTex = sideOrnamentTexture(700, 220); // left/right ends — frame + shapes
      const lidInTex = plainPanel(512, 512, WHITE, 0.4);   // interior: plain white
      const creaseInnerTex = creasedInnerTexture(700, 150, BOX_W); // long-wall interior + glue creases
      const oMat = (maps) => foilMat(maps);
      const navyMat = () => cardMat(navyTex);
      const sideOrnMat = () => cardMat(sideOrnTex);

      /* ---------- floor ---------- */
      const floor = new THREE.Mesh(new THREE.BoxGeometry(BOX_W, FLOOR_T, BOX_D), [
        navyMat(), navyMat(),
        cardMat(whiteTex),          // +y interior white
        navyMat(),                  // -y lower cover — plain navy (no gold)
        navyMat(), navyMat()
      ]);
      floor.position.y = FLOOR_T / 2;
      floor.castShadow = floor.receiveShadow = true;
      trayGroup.add(floor);

      // face order [+x,-x,+y,-y,+z,-z] = [right,left,top,bottom,front,back]
      // board THICKNESS edges stay NAVY so corners never flash a white seam line
      const wI = () => cardMat(whiteTex); // interior white (inner face only)
      // back wall — plain navy exterior; only +z (inside) is white
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(BOX_W, BOX_H, T), [
        navyMat(), navyMat(), navyMat(), navyMat(), cardMat(creaseInnerTex), navyMat()
      ]);
      backWall.position.set(0, BOX_H / 2 + FLOOR_T, -BOX_D / 2 + T / 2);
      backWall.castShadow = backWall.receiveShadow = true;
      trayGroup.add(backWall);

      // front wall — plain navy + LIVE gold foil logo; only -z (inside) is white
      const frontWall = new THREE.Mesh(new THREE.BoxGeometry(BOX_W, BOX_H, T), [
        navyMat(), navyMat(), navyMat(), navyMat(), navyMat(), cardMat(creaseInnerTex)
      ]);
      frontWall.position.set(0, BOX_H / 2 + FLOOR_T, BOX_D / 2 - T / 2);
      frontWall.castShadow = frontWall.receiveShadow = true;
      trayGroup.add(frontWall);
      const frontFoil = makeFoilDecal(BOX_W, 0.26);
      if (frontFoil) {
        frontFoil.position.set(0, 0, T / 2 + 0.0015);
        frontWall.add(frontFoil);
      }

      // left / right ends — ornaments outside; white ONLY on the inner face
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(T, BOX_H, BOX_D), [
        wI(), sideOrnMat(), navyMat(), navyMat(), navyMat(), navyMat()
      ]);
      leftWall.position.set(-BOX_W / 2 + T / 2, BOX_H / 2 + FLOOR_T, 0);
      leftWall.castShadow = leftWall.receiveShadow = true;
      trayGroup.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(T, BOX_H, BOX_D), [
        sideOrnMat(), wI(), navyMat(), navyMat(), navyMat(), navyMat()
      ]);
      rightWall.position.set(BOX_W / 2 - T / 2, BOX_H / 2 + FLOOR_T, 0);
      rightWall.castShadow = rightWall.receiveShadow = true;
      trayGroup.add(rightWall);

      /* ---------- top LID: hinged at the back top edge ---------- */
      const TOP_Y = FLOOR_T + BOX_H;
      const lidPivot = new THREE.Group();
      lidPivot.position.set(0, TOP_Y, -BOX_D / 2 + T);
      trayGroup.add(lidPivot);

      // lid — rounded gold frame on top + LIVE foil logo; white interior
      const lid = new THREE.Mesh(new THREE.BoxGeometry(BOX_W, T, BOX_D), [
        navyMat(), navyMat(),
        oMat(lidTopMaps),           // +y rounded gold foil frame
        cardMat(lidInTex),
        navyMat(), navyMat()
      ]);
      lid.position.set(0, T / 2, BOX_D / 2); // extends forward from the hinge
      lid.castShadow = lid.receiveShadow = true;
      lidPivot.add(lid);
      const lidFoil = makeFoilDecal(BOX_W, 0.34);
      if (lidFoil) {
        lidFoil.rotation.x = -Math.PI / 2; // lay flat on lid top
        lidFoil.position.set(0, T / 2 + 0.0015, 0);
        lid.add(lidFoil);
      }

      // front TUCK flap on the lid's far edge — folds down ~90° to slip
      // inside the front wall and lock the box shut
      // THREE lock tabs forming ONE connected U-shaped skirt around the front
      // and both sides — every tab is FULL box height so its lower edge
      // reaches the base, and they meet at the two front corners (like the
      // real glued/locked apron), all folding DOWN over the OUTER wall faces.
      const TUCK_H = BOX_H; // full height → reaches the base

      // main front tab — hinge at the lid's front edge, folds down OUTSIDE
      const tuckPivot = new THREE.Group();
      tuckPivot.position.set(0, 0, BOX_D); // lid front edge (just outside the front wall)
      tuckPivot.rotation.x = Math.PI / 2; // fold DOWN over the outer front face
      lidPivot.add(tuckPivot);
      const tuck = new THREE.Mesh(
        notchedTabGeometry(BOX_W, TUCK_H, T, BOX_H * 0.3), // finger notch on the free edge
        [foilMat(tabMaps), navyMat()] // outer cap = gold foil logo, edges = plain navy
      );
      tuck.position.set(0, 0, 0); // extends out → after the pivot fold, hangs DOWN over the outside
      tuck.castShadow = tuck.receiveShadow = true;
      tuckPivot.add(tuck);

      // white LINER on the tab's inner side — the extrude caps share one
      // material, so this thin white copy hides the logo from the inside
      // (the interior must be plain white)
      const tuckLiner = new THREE.Mesh(
        notchedTabGeometry(BOX_W - 0.02, TUCK_H - 0.01, T * 0.3, BOX_H * 0.3),
        cardMat(plainPanel(512, 512, WHITE, 0.4))
      );
      tuckLiner.position.set(0, -T * 0.45, 0);   // just behind the inner cap
      tuckPivot.add(tuckLiner);

      // two side tabs — white ornaments on outer face (rotated to follow long z-axis)
      const sideTabFace = sideOrnamentTexture(700, 220);
      sideTabFace.center.set(0.5, 0.5); sideTabFace.rotation = Math.PI / 2;
      const sideTucks = [];
      [-1, 1].forEach((sx) => {
        const p = new THREE.Group();
        p.position.set(sx * BOX_W / 2, 0, BOX_D / 2); // lid side edge, centered in depth
        p.rotation.z = -sx * Math.PI / 2; // fold down over the outer side face
        lidPivot.add(p);
        const st = new THREE.Mesh(new THREE.BoxGeometry(TUCK_H, T, BOX_D), [
          navyMat(), navyMat(),
          cardMat(sideTabFace),                              // +y = OUTER: white frame + shapes
          cardMat(plainPanel(512, 512, WHITE, 0.4)),         // -y = INNER face: plain white
          navyMat(), navyMat()
        ]);
        st.position.set(sx * TUCK_H / 2, 0, 0); // extends out → hangs down full height after fold
        st.castShadow = st.receiveShadow = true;
        p.add(st);
        sideTucks.push(p);
      });

      scene.add(trayGroup);
      trayGroup.position.y = -0.6;

      const boxGroup = new THREE.Group();
      boxGroup.add(trayGroup);
      scene.add(boxGroup);

      /* ---------- soft ground shadow ---------- */
      const shadowCatcher = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.ShadowMaterial({ opacity: 0.28 })
      );
      shadowCatcher.rotation.x = -Math.PI / 2;
      shadowCatcher.position.y = -0.6 - 0.001;
      shadowCatcher.receiveShadow = true;
      scene.add(shadowCatcher);

      /* ---------- fold state: 0 = lid open, 1 = lid closed (top face only) ---------- */
      const OPEN_ANGLE = 2.15;
      // start slightly open so the box isn't dark / fully shut on load
      let foldTarget = 0.22, fold = 0.22;
      function applyFold(t) {
        lidPivot.rotation.x = -OPEN_ANGLE * (1 - t); // t=1 closed (flat), t=0 open UP & back
      }
      applyFold(fold);

      const foldSlider = document.getElementById("foldSlider");
      const lblOpen = document.getElementById("lblOpen");
      const lblClose = document.getElementById("lblClose");
      function paintSlider() {
        const v = +foldSlider.value;
        foldSlider.style.setProperty("--val", (v * 100) + "%");
        lblClose.classList.toggle("active", v > 0.5);
        lblOpen.classList.toggle("active", v <= 0.5);
      }
      foldSlider.value = String(foldTarget);
      foldSlider.addEventListener("input", () => { foldTarget = +foldSlider.value; paintSlider(); resetIdle(); });
      paintSlider();
      ["pointerdown", "mousedown", "mousemove", "touchstart", "touchmove"].forEach((type) => {
        foldSlider.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
      });

      /* ---------- drag to rotate 360° (mouse + 1-finger touch) ---------- */
      let dragging = false, px = 0, py = 0;
      const rot = { x: 0.36, y: Math.PI / 6 };
      boxGroup.rotation.set(rot.x, rot.y, 0);

      function applyZoom(factor) {
        camera.position.multiplyScalar(factor);
        const dd = camera.position.length();
        if (dd < 4.5) camera.position.setLength(4.5);
        if (dd > 16)  camera.position.setLength(16);
      }

      function down(cx, cy) { dragging = true; px = cx; py = cy; document.body.classList.add("grabbing"); resetIdle(); }
      function move(cx, cy) {
        if (!dragging) return;
        rot.y += (cx - px) * 0.011;
        rot.x += (cy - py) * 0.011;
        boxGroup.rotation.set(rot.x, rot.y, 0);
        px = cx; py = cy;
      }
      function up() { dragging = false; document.body.classList.remove("grabbing"); }

      addEventListener("mousedown", e => down(e.clientX, e.clientY));
      addEventListener("mousemove", e => move(e.clientX, e.clientY));
      addEventListener("mouseup", up);

      let pinchDist = 0;
      const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

      addEventListener("touchstart", e => {
        e.preventDefault();
        if (e.touches.length === 2) { dragging = false; pinchDist = dist(e.touches[0], e.touches[1]); resetIdle(); }
        else if (e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      addEventListener("touchmove", e => {
        e.preventDefault();
        if (e.touches.length === 2) {
          const dd = dist(e.touches[0], e.touches[1]);
          if (pinchDist > 0) applyZoom(1 + (pinchDist - dd) * 0.004);
          pinchDist = dd;
          resetIdle();
        } else if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      addEventListener("touchend", e => {
        if (e.touches.length < 2) pinchDist = 0;
        if (e.touches.length === 0) up();
      }, { passive: false });

      addEventListener("wheel", e => { e.preventDefault(); applyZoom(1 + e.deltaY * 0.0009); }, { passive: false });

      /* ---------- gentle auto-rotate after idle ---------- */
      let autoOn = false, idleTimer = null;
      function resetIdle() {
        autoOn = false;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { autoOn = true; }, 3000);
      }
      resetIdle();

      /* ---------- loop ---------- */
      addEventListener("message", function (e) { if (e.data === "mzk:pause") window.__mzkPaused = true; else if (e.data === "mzk:resume") window.__mzkPaused = false; });
      document.addEventListener("visibilitychange", function () { window.__mzkPaused = document.hidden; });
      let foilFrame = 0, lastFoilRx = NaN, lastFoilRy = NaN;
      (function animate() {
        requestAnimationFrame(animate);
        if (window.__mzkPaused) return;
        if (autoOn && !dragging) { rot.y += 0.003; boxGroup.rotation.y = rot.y; }
        if (Math.abs(foldTarget - fold) > 0.0005) {
          fold += (foldTarget - fold) * 0.09;
          applyFold(fold);
        }
        // live foil: only when rotation changed, and at most every 3rd frame (big GPU save)
        foilFrame++;
        const rotMoved = Math.abs(rot.x - lastFoilRx) > 0.0008 || Math.abs(rot.y - lastFoilRy) > 0.0008;
        if (rotMoved && (foilFrame % 3 === 0 || dragging)) {
          lastFoilRx = rot.x; lastFoilRy = rot.y;
          for (let i = 0; i < foilDecals.length; i++) {
            const fn = foilDecals[i].userData.foilPaint;
            if (fn) fn(rot.x, rot.y);
          }
        }
        renderer.render(scene, camera);
      })();

      window.__debug = { THREE, boxGroup, trayGroup, lidPivot, lid, tuck, tuckPivot, sideTucks, camera, scene, renderer, rot, foilDecals,
        setFold: (t) => { foldTarget = t; fold = t; applyFold(t); } };

      console.log("✓ mailer box ready");
    }
  </script>
</body>
</html>
