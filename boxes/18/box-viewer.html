<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mozaik 3D Kutu Görüntüleyicisi — Oluklu Taşıma Saplı Koli</title>
  <link rel="stylesheet" href="../box.css?v=28" />
</head>
<body>

  <div class="fold-ctrl" id="foldCtrl">
    <span class="lbl" id="lblOpen">Open</span>
    <input type="range" id="foldSlider" min="0" max="1" step="0.001" value="0" />
    <span class="lbl" id="lblClose">Close</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    "use strict";

    /* ---------- palette ---------- */
    const WHITE = "#f6f5f2";        // white lid
    const NAVY  = "#2a3670";        // deep navy base (matches the reference shoe box)
    const KRAFT = "#b17d4b";        // warm kraft brown for the INSIDE of the corrugated board

    /* load the colored horizontal logo (for the WHITE lid), the white logo
       (for the NAVY base) and the mosaic M-mark, then init */
    let logo = null, logoW = null, mark = null, loaded = 0;
    function ready() { if (++loaded === 3) init(); }
    const logoImg = new Image();
    logoImg.onload  = () => { logo = logoImg; ready(); };
    logoImg.onerror = () => { console.warn("mozaik-logo-colored.png not found"); ready(); };
    logoImg.src = "assets/mozaik-logo-colored.png";
    const logoWImg = new Image();
    logoWImg.onload  = () => { logoW = logoWImg; ready(); };
    logoWImg.onerror = () => { console.warn("mozaik-logo-white.png not found"); ready(); };
    logoWImg.src = "assets/mozaik-logo-white.png";
    const markImg = new Image();
    markImg.onload  = () => { mark = markImg; ready(); };
    markImg.onerror = () => { console.warn("logo-mark.png not found"); ready(); };
    markImg.src = "assets/logo-mark.png";

    function init() {
      console.log("init, logo:", logo ? "ok" : "none", "logoW:", logoW ? "ok" : "none", "mark:", mark ? "ok" : "none");

      /* ---------- renderer ---------- */
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      var __mzkWeak = (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || matchMedia("(prefers-reduced-motion: reduce)").matches;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, __mzkWeak ? 1 : 1.5));  // weak devices render at 1x (big GPU saving); strong devices stay crisp at 1.5x
      renderer.shadowMap.enabled = false;   // ground shadow removed (perf: no shadow-map pass)
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
      camera.position.set(0, 5.2, 16.5);
      camera.lookAt(0, 0.35, 0);

      function fitToContainer() {
        const w = document.documentElement.clientWidth || innerWidth || 1280;
        const h = document.documentElement.clientHeight || innerHeight || 720;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      fitToContainer();
      if (window.ResizeObserver) new ResizeObserver(fitToContainer).observe(document.body);
      addEventListener("resize", fitToContainer);

      /* ---------- lighting ---------- */
      scene.add(new THREE.HemisphereLight(0xffffff, 0x33333a, 0.64));

      const key = new THREE.DirectionalLight(0xffffff, 0.42);
      key.position.set(4, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 1; key.shadow.camera.far = 30;
      key.shadow.camera.left = key.shadow.camera.bottom = -8;
      key.shadow.camera.right = key.shadow.camera.top = 8;
      key.shadow.bias = -0.0004;
      key.shadow.radius = 7;
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xffffff, 0.18);
      fill.position.set(-5, 3, -4);
      scene.add(fill);

      /* ---------- helpers ---------- */
      function toTexture(c) {
        const t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return t;
      }

      function paperGrain(x, w, h, strength) {
        const s = (strength == null ? 1 : strength) * 0.5;
        for (let i = 0; i < w * h / 900; i++) {
          const light = Math.random() > 0.5;
          x.fillStyle = light
            ? "rgba(255,255,255," + (Math.random() * 0.07 * s) + ")"
            : "rgba(80,70,55,"   + (Math.random() * 0.05 * s) + ")";
          x.fillRect(Math.random() * w, Math.random() * h, 1.4 + Math.random() * 1.4, 1.4 + Math.random() * 1.4);
        }
      }

      const bumpTex = (function () {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, 512, 512);
        const d = x.getImageData(0, 0, 512, 512);
        for (let i = 0; i < d.data.length; i += 4) {
          const n = 128 + (Math.random() - 0.5) * 18;
          d.data[i] = d.data[i + 1] = d.data[i + 2] = n;
        }
        x.putImageData(d, 0, 0);
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 3);
        return t;
      })();

      function plainPanel(w, h, base, strength) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const x = c.getContext("2d");
        x.fillStyle = base;
        x.fillRect(0, 0, w, h);
        paperGrain(x, w, h, strength == null ? 1 : strength);
        return toTexture(c);
      }

      /* colored panel + a centered image (no rotation).
         bg = background colour, cx/cy = fractional centre, frac = width fraction */
      function imgPanel(img, wPx, hPx, frac, bg, cx, cy) {
        cx = (cx == null ? 0.5 : cx); cy = (cy == null ? 0.5 : cy);
        const c = document.createElement("canvas");
        c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        x.fillStyle = bg || WHITE;
        x.fillRect(0, 0, wPx, hPx);
        if (img) {
          const ratio = img.naturalHeight / img.naturalWidth;
          const lw = Math.round(wPx * frac);
          const lh = Math.round(lw * ratio);
          x.drawImage(img, Math.round(wPx * cx - lw / 2), Math.round(hPx * cy - lh / 2), lw, lh);
        }
        paperGrain(x, wPx, hPx, bg && bg !== WHITE ? 0.5 : 0.4);
        return toTexture(c);
      }

      /* colored panel + faint centred text line (subtle side print) */
      function textPanel(wPx, hPx, bg, txt, col) {
        const c = document.createElement("canvas");
        c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        x.fillStyle = bg;
        x.fillRect(0, 0, wPx, hPx);
        x.fillStyle = col;
        x.textAlign = "center";
        x.textBaseline = "middle";
        x.font = "600 " + Math.round(hPx * 0.16) + "px 'Segoe UI', Arial, sans-serif";
        x.globalAlpha = 0.85;
        x.translate(wPx / 2, hPx / 2);
        for (let i = 0; i < txt.length; i++) {
          x.fillText(txt[i], 0, (i - (txt.length - 1) / 2) * hPx * 0.19);
        }
        x.globalAlpha = 1;
        paperGrain(x, wPx, hPx, bg !== WHITE ? 0.5 : 0.4);
        return toTexture(c);
      }

      const cardMat = (map) => new THREE.MeshStandardMaterial({
        map, metalness: 0.0, roughness: 0.86, bumpMap: bumpTex, bumpScale: 0.011, side: THREE.DoubleSide
      });

      const whiteTex = plainPanel(1024, 1024, WHITE, 0.5);
      const navyTex  = plainPanel(1024, 1024, NAVY, 0.5);
      const kraftTex = plainPanel(1024, 1024, KRAFT, 0.55);
      const wMat = () => cardMat(whiteTex);          // white outer (lid)
      const nMat = () => cardMat(navyTex);           // navy outer (base)
      const kMat = () => cardMat(kraftTex);          // kraft brown inner

      /* =========================================================
         GEOMETRY — telescopic corrugated CARRY carton (from box 11):
         much LONGER navy base + white lid, kraft-brown INTERIOR and
         kraft FLUTE, with oval finger HANDLES on both short ends.
         ========================================================= */
      const BW = 2.75, BH = 2.55, BD = 2.05;  // near-square front face (width ≈ height)
      const LID_H = 0.62;                     // lid skirt height (declared early for handle alignment)
      const tL  = 0.004;                     // liner thickness (very thin, per side)
      const gap = 0.024;                     // flute gap between the two liners
      const TC  = 2 * tL + gap;              // total board thickness (~0.032 — very thin)
      const amp = gap * 0.5 * 0.92;          // flute wave amplitude (deep, nearly liner-to-liner)
      const per = 0.055;                     // flute pitch (tight waves = real corrugation feel)
      // rounded-rect finger handles (shared by base ends + lid end skirts)
      const HAND_W = 0.62, HAND_H = 0.22, HAND_R = 0.07;
      const HAND_Y_BASE = BH / 2 - LID_H / 2; // aligns with lid-skirt mid when closed

      /* faces order for BoxGeometry mats: [+x, -x, +y, -y, +z, -z] */
      function boxMesh(w, h, d, mats) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
        m.castShadow = m.receiveShadow = true;
        return m;
      }

      const kraftEdgeTex = plainPanel(1024, 256, KRAFT, 0.55);   // flute sheet colour
      const SHOW_FLUTE = true;

      /* rounded rectangle path centred at (cx, cy) — for die-cut hand holes */
      function roundedRectPath(cx, cy, rw, rh, rad) {
        const path = new THREE.Path();
        const x = cx - rw / 2, y = cy - rh / 2;
        const r = Math.min(rad, rw / 2, rh / 2);
        path.moveTo(x + r, y);
        path.lineTo(x + rw - r, y);
        path.absarc(x + rw - r, y + r, r, -Math.PI / 2, 0, false);
        path.lineTo(x + rw, y + rh - r);
        path.absarc(x + rw - r, y + rh - r, r, 0, Math.PI / 2, false);
        path.lineTo(x + r, y + rh);
        path.absarc(x + r, y + rh - r, r, Math.PI / 2, Math.PI, false);
        path.lineTo(x, y + r);
        path.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
        return path;
      }
      function roundedRectShape(cx, cy, rw, rh, rad) {
        const s = new THREE.Shape();
        const x = cx - rw / 2, y = cy - rh / 2;
        const r = Math.min(rad, rw / 2, rh / 2);
        s.moveTo(x + r, y);
        s.lineTo(x + rw - r, y);
        s.absarc(x + rw - r, y + r, r, -Math.PI / 2, 0, false);
        s.lineTo(x + rw, y + rh - r);
        s.absarc(x + rw - r, y + rh - r, r, 0, Math.PI / 2, false);
        s.lineTo(x + r, y + rh);
        s.absarc(x + r, y + rh - r, r, Math.PI / 2, Math.PI, false);
        s.lineTo(x, y + r);
        s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
        return s;
      }

      /* panel outline (+ optional rounded-rect finger-handle hole) in local XY */
      function boardShape(w, h, handY) {
        const s = new THREE.Shape();
        s.moveTo(-w / 2, -h / 2);
        s.lineTo( w / 2, -h / 2);
        s.lineTo( w / 2,  h / 2);
        s.lineTo(-w / 2,  h / 2);
        s.closePath();
        if (handY != null) {
          s.holes.push(roundedRectPath(0, handY, HAND_W, HAND_H, HAND_R));
        }
        return s;
      }

      /* kraft rim around a finger-handle cut so the flute edge reads brown */
      function handleRim(handY) {
        const pad = 0.014;
        const rim = roundedRectShape(0, handY, HAND_W + pad * 2, HAND_H + pad * 2, HAND_R + pad);
        rim.holes.push(roundedRectPath(0, handY, HAND_W, HAND_H, HAND_R));
        const geo = new THREE.ExtrudeGeometry(rim, {
          depth: TC * 0.92, bevelEnabled: false, curveSegments: 20
        });
        geo.translate(0, 0, -TC * 0.46);
        const m = new THREE.Mesh(geo, kMat());
        m.castShadow = m.receiveShadow = true;
        return m;
      }

      /* a flat corrugated board in the local XY plane, thickness along +z,
         OUTER (printed) face toward +z, INNER (kraft) toward -z.
         handY = local Y of oval finger hole (null = solid panel). */
      function corrugatedBoard(w, h, faceMat, skinMat, handY) {
        const g = new THREE.Group();
        const skin = skinMat || wMat;

        if (handY == null) {
          // OUTER liner — printed face (+z); thin edges = skin colour.
          const outer = boxMesh(w, h, tL, [skin(), skin(), skin(), skin(), faceMat, skin()]);
          outer.position.z = TC / 2 - tL / 2;
          g.add(outer);

          // INNER liner — KRAFT interior (-z)
          const inner = boxMesh(w, h, tL, [skin(), skin(), skin(), skin(), skin(), kMat()]);
          inner.position.z = -(TC / 2 - tL / 2);
          g.add(inner);
        } else {
          // liners with die-cut oval handle
          const shape = boardShape(w, h, handY);
          const mkLiner = (z, mats) => {
            const geo = new THREE.ExtrudeGeometry(shape, {
              depth: tL, bevelEnabled: false, curveSegments: 28
            });
            // Extrude +z; remap so +z face uses faceMat slot via Mesh with single mat groups is hard —
            // use one material for the liner body (face for outer, kraft for inner)
            const mesh = new THREE.Mesh(geo, mats);
            mesh.position.z = z;
            mesh.castShadow = mesh.receiveShadow = true;
            return mesh;
          };
          g.add(mkLiner(TC / 2 - tL, faceMat));   // outer printed
          g.add(mkLiner(-(TC / 2), kMat()));       // inner kraft
          g.add(handleRim(handY));
        }

        // FLUTE — wavy KRAFT sheet between the liners (bands above/below a handle cut)
        if (SHOW_FLUTE) {
          const mrgX = TC * 4, mrgY = TC * 4;
          const x0 = -w / 2 + mrgX, x1 = w / 2 - mrgX, y0 = -h / 2 + mrgY, y1 = h / 2 - mrgY;
          const N = Math.max(8, Math.round((x1 - x0) / per * 2));
          const hy0 = (handY == null ? 1e9 : handY) - HAND_H / 2 - 0.02;
          const hy1 = (handY == null ? -1e9 : handY) + HAND_H / 2 + 0.02;
          const bands = (handY == null)
            ? [[y0, y1]]
            : [[y0, hy0], [hy1, y1]].filter(function (b) { return b[1] - b[0] > 0.02; });
          const pos = [], idx = [];
          bands.forEach(function (band) {
            const by0 = band[0], by1 = band[1];
            const base = pos.length / 3;
            for (let i = 0; i <= N; i++) {
              const x = x0 + (x1 - x0) * i / N;
              const z = amp * Math.sin((x - x0) / per * Math.PI * 2);
              pos.push(x, by0, z,  x, by1, z);
            }
            for (let i = 0; i < N; i++) {
              const a = base + i * 2, b = a + 1, c = a + 2, d = a + 3;
              idx.push(a, c, b,  b, c, d);
            }
          });
          if (pos.length) {
            const fg = new THREE.BufferGeometry();
            fg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
            fg.setIndex(idx);
            fg.computeVertexNormals();
            const fl = new THREE.Mesh(fg, cardMat(kraftTex));
            fl.castShadow = fl.receiveShadow = true;
            g.add(fl);
          }
        }
        return g;
      }

      /* a SOLID single-sheet board (no corrugation gap) — same face layout as
         corrugatedBoard (+z = printed face, other faces = skin) but one solid slab
         of thickness TC, so its cut edges/rim are flush with NO opening. Used for the
         lid top so the top-face perimeter shows no gap. */
      function solidBoard(w, h, faceMat, skinMat) {
        const skin = skinMat || wMat;
        // +z printed outer, -z kraft interior (after lid rotation → underside)
        return boxMesh(w, h, TC, [skin(), skin(), skin(), skin(), faceMat, kMat()]);
      }

      const boxGroup = new THREE.Group();
      // inner wrapper for the folding content (base + lid). boxGroup is the group that spins;
      // offsetting THIS inner group (below) keeps the box's centre on the spin axis so the
      // lid sliding out to the side doesn't make the whole box swing in a circle.
      const content = new THREE.Group();
      boxGroup.add(content);

      /* ---------- printed textures ---------- */
      // lid TOP — colored logo on white
      const lidTopTex   = imgPanel(logo, 1440, 840, 0.60, WHITE, 0.5, 0.5);
      // lid SIDE logo decal — colored logo on a TRANSPARENT strip (sits on the white
      // skirt), drawn as a billboard so it reads correctly on all four sides.
      const logoRatio = logo ? logo.naturalHeight / logo.naturalWidth : 0.36;
      const lidLogoDecalTex = (function () {
        const wPx = 1024, hPx = Math.max(1, Math.round(1024 * logoRatio));
        const c = document.createElement("canvas"); c.width = wPx; c.height = hPx;
        const x = c.getContext("2d");
        if (logo) x.drawImage(logo, 0, 0, wPx, hPx);
        return toTexture(c);
      })();
      // base long faces — white logo on navy; canvas aspect MATCHES wall BW:BH; logo vertically centred
      const frontHpx = 1100, frontWpx = Math.round(frontHpx * BW / BH);
      const baseFrontTex = imgPanel(logoW, frontWpx, frontHpx, 0.48, NAVY, 0.5, 0.5);
      const baseBackTex  = imgPanel(logoW, frontWpx, frontHpx, 0.48, NAVY, 0.5, 0.5);

      // end-wall logo decal (mark / white logo) — NOT baked into ExtrudeGeometry (UVs distort)
      const endLogoImg = mark || logoW || logo;
      const endLogoDecalTex = (function () {
        if (!endLogoImg) return null;
        const lgW = endLogoImg.naturalWidth || endLogoImg.width;
        const lgH = endLogoImg.naturalHeight || endLogoImg.height;
        const c = document.createElement("canvas");
        c.width = lgW; c.height = lgH;
        c.getContext("2d").drawImage(endLogoImg, 0, 0);
        return toTexture(c);
      })();

      /* =========================================================
         BASE — navy tray: 4 walls (navy outer, kraft inner) + a
         closed bottom, OPEN top. All exterior edges read navy.
         ========================================================= */
      const base = new THREE.Group();
      content.add(base);

      (function () { const b = corrugatedBoard(BW, BH, cardMat(baseFrontTex), nMat); b.position.set(0, 0, BD / 2 - TC / 2); base.add(b); })();                        // front (+z)
      (function () { const b = corrugatedBoard(BW, BH, cardMat(baseBackTex),  nMat); b.rotation.y = Math.PI;      b.position.set(0, 0, -BD / 2 + TC / 2); base.add(b); })(); // back (-z)
      // short ends — plain navy + handle cut; logo as a clean billboard below the hole
      (function () { const b = corrugatedBoard(BD - 2 * TC, BH, nMat(), nMat, HAND_Y_BASE); b.rotation.y =  Math.PI / 2; b.position.set(BW / 2 - TC / 2, 0, 0); base.add(b); })();
      (function () { const b = corrugatedBoard(BD - 2 * TC, BH, nMat(), nMat, HAND_Y_BASE); b.rotation.y = -Math.PI / 2; b.position.set(-BW / 2 + TC / 2, 0, 0); base.add(b); })();

      if (endLogoDecalTex && endLogoImg) {
        const wallW = BD - 2 * TC;
        const endRatio = (endLogoImg.naturalHeight || endLogoImg.height) / (endLogoImg.naturalWidth || endLogoImg.width);
        const endLogoW = wallW * 0.40;
        const endLogoH = endLogoW * endRatio;
        // vertically centred on the end face (below the handle clear zone)
        const handClear = HAND_Y_BASE - HAND_H / 2 - 0.08;
        let endLogoY = 0;
        if (endLogoY + endLogoH / 2 > handClear) endLogoY = handClear - endLogoH / 2 - 0.02;
        const eps = 0.004;
        function endLogo(rotY, x) {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(endLogoW, endLogoH),
            new THREE.MeshStandardMaterial({
              map: endLogoDecalTex, transparent: true, alphaTest: 0.25,
              roughness: 0.9, metalness: 0.0, depthWrite: false, side: THREE.FrontSide
            })
          );
          m.rotation.y = rotY;
          m.position.set(x, endLogoY, 0);
          base.add(m);
        }
        endLogo( Math.PI / 2,  BW / 2 + eps);  // right (+x)
        endLogo(-Math.PI / 2, -BW / 2 - eps);  // left (-x)
      }

      // NAVY corner posts — outer navy, inner kraft
      [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(function (s) {
        const m = [kMat(), kMat(), nMat(), nMat(), kMat(), kMat()];
        m[s[0] > 0 ? 0 : 1] = nMat();   // outer X face → navy
        m[s[1] > 0 ? 4 : 5] = nMat();   // outer Z face → navy
        const p = new THREE.Mesh(new THREE.BoxGeometry(TC, BH, TC), m);
        p.castShadow = p.receiveShadow = true;
        p.position.set(s[0] * (BW / 2 - TC / 2), 0, s[1] * (BD / 2 - TC / 2));
        base.add(p);
      });

      // closed bottom — navy outside, kraft interior floor
      (function () {
        const m = [nMat(), nMat(), nMat(), nMat(), nMat(), kMat()];
        const b = boxMesh(BW, BD, TC, m);
        b.rotation.x = Math.PI / 2;
        b.position.set(0, -BH / 2 + TC / 2 - 0.002, 0);
        base.add(b);
      })();

      /* =========================================================
         LID — shallow white cap that telescopes DOWN over the base:
         a printed top panel + a short skirt, slightly larger so it
         sits OUTSIDE the base walls. Lifted/lowered by the slider.
         ========================================================= */
      const lid = new THREE.Group();
      content.add(lid);

      const clr   = 0.012;                       // clearance between lid skirt and base wall
      const LW = BW + 2 * TC + 2 * clr;          // lid outer width
      const LD = BD + 2 * TC + 2 * clr;          // lid outer depth

      // TOP panel — SOLID board; white outer UP + kraft underside
      (function () {
        const b = solidBoard(LW, LD, cardMat(lidTopTex), wMat);
        b.rotation.x = -Math.PI / 2;             // outer (+z) → +y (up)
        b.position.y = TC / 2;                   // outer (white) face sits at lid local top
        lid.add(b);
      })();

      // SKIRT — 4 short white walls; short ends carry matching finger handles
      (function () {
        const yc = -LID_H / 2 + TC / 2;          // skirt centred just under the top panel
        const bF = corrugatedBoard(LW, LID_H, wMat(), wMat); bF.position.set(0, yc,  LD / 2 - TC / 2); lid.add(bF);                     // front (+z)
        const bB = corrugatedBoard(LW, LID_H, wMat(), wMat); bB.rotation.y = Math.PI;      bB.position.set(0, yc, -LD / 2 + TC / 2); lid.add(bB); // back (-z)
        const bR = corrugatedBoard(LD - 2 * TC, LID_H, wMat(), wMat, 0); bR.rotation.y =  Math.PI / 2; bR.position.set(LW / 2 - TC / 2, yc, 0); lid.add(bR); // right + handle
        const bL = corrugatedBoard(LD - 2 * TC, LID_H, wMat(), wMat, 0); bL.rotation.y = -Math.PI / 2; bL.position.set(-LW / 2 + TC / 2, yc, 0); lid.add(bL); // left + handle

        // LOGO decals on the FOUR small side faces — thin billboards just outside each
        // skirt face; a plane rotated to face outward shows the logo un-mirrored on
        // every side. Transparent background → only the logo ink sits on the white.
        const LOGOW = 0.92, LOGOH = LOGOW * logoRatio, eps = 0.003;
        function sideLogo(rotY, pos) {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(LOGOW, LOGOH),
            new THREE.MeshStandardMaterial({ map: lidLogoDecalTex, transparent: true, alphaTest: 0.5, roughness: 0.9, metalness: 0.0 })
          );
          m.rotation.y = rotY; m.position.set(pos[0], yc, pos[2]);
          lid.add(m);
        }
        sideLogo(0,            [0, 0,  LD / 2 + eps]);   // front (+z)
        sideLogo(Math.PI,      [0, 0, -LD / 2 - eps]);   // back (-z)
        // left/right ends keep finger-handle holes clear (no logo decal)

        // WHITE corner posts — fill the TC×TC vertical corner column to hide the
        // seam between adjacent skirt panels. FLUSH: outer faces land exactly on the
        // lid's outer planes (±LW/2, ±LD/2) and inner faces on the walls' inner
        // planes → the post sticks out NEITHER inward NOR outward. All-white, so it
        // blends seamlessly with the white lid.
        [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(function (s) {
          const p = new THREE.Mesh(new THREE.BoxGeometry(TC, LID_H, TC),
            [wMat(), wMat(), wMat(), wMat(), wMat(), wMat()]);
          p.castShadow = p.receiveShadow = true;
          p.position.set(s[0] * (LW / 2 - TC / 2), yc, s[1] * (LD / 2 - TC / 2));
          lid.add(p);
        });
      })();

      // closed position: lid top just above the base rim; skirt overlaps the upper base
      const LID_CLOSED_Y = BH / 2 + clr;
      lid.position.y = LID_CLOSED_Y;

      scene.add(boxGroup);
      boxGroup.position.y = 0.15;

      /* ---------- soft ground shadow ---------- */
      const groundY = -BH / 2 + 0.15 - 0.001;
      const shadowCatcher = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.ShadowMaterial({ opacity: 0.28 })
      );
      shadowCatcher.rotation.x = -Math.PI / 2;
      shadowCatcher.position.y = groundY;
      shadowCatcher.receiveShadow = true;
      scene.add(shadowCatcher);

      /* ---------- lid state: 0 = CLOSED, 1 = OPEN (flipped upside-down beside the base) ----------
         Phased so the lid never clips the base sides or the ground:
           1) rise straight up  →  2) slide beside  →  3) flip 180°  →  4) lower onto ground */
      const OPEN_X = (BW + LW) / 2 + 0.28;         // rest beside the base along +X
      const OPEN_Y = -BH / 2 + TC / 2;              // top panel flat on the ground (after flip)
      const LIFT_PEAK = BH / 2 + LID_H + 0.7;      // high enough to clear walls before any flip/slide
      let liftTarget = 0, lift = 0;
      function smoothSeg(t, a, b) {
        if (t <= a) return 0;
        if (t >= b) return 1;
        const u = (t - a) / (b - a);
        return u * u * (3 - 2 * u);
      }
      function applyLift(t) {
        const pUp   = smoothSeg(t, 0.00, 0.28);  // 1) lift vertically first
        const pSide = smoothSeg(t, 0.26, 0.52);  // 2) slide clear of the base
        const pFlip = smoothSeg(t, 0.50, 0.78);  // 3) flip only once beside & high
        const pDown = smoothSeg(t, 0.76, 1.00);  // 4) lower onto the ground

        const yHigh = LID_CLOSED_Y + pUp * (LIFT_PEAK - LID_CLOSED_Y);
        lid.position.x = pSide * OPEN_X;
        lid.position.y = pDown > 0 ? (LIFT_PEAK * (1 - pDown) + OPEN_Y * pDown) : yHigh;
        lid.position.z = 0;
        lid.rotation.set(0, 0, pFlip * Math.PI);
      }
      applyLift(lift);

      /* keep the box spinning around its OWN centre while the slider opens it: as the lid
         lifts and slides out to the side, the base+lid horizontal centre drifts, and because
         boxGroup spins about its origin that drift makes the whole thing swing in a circle.
         Cancel it by nudging the inner content group so the X/Z centre stays fixed. */
      const _rcBox = new THREE.Box3(), _rcC = new THREE.Vector3();
      let _rcX0 = 0, _rcZ0 = 0;
      function _measureCentre() {
        const rx = boxGroup.rotation.x, ry = boxGroup.rotation.y, rz = boxGroup.rotation.z;
        const px = content.position.x, pz = content.position.z;
        boxGroup.rotation.set(0, 0, 0);
        content.position.x = 0; content.position.z = 0;
        boxGroup.updateWorldMatrix(true, true);
        _rcBox.setFromObject(content); _rcBox.getCenter(_rcC);
        boxGroup.rotation.set(rx, ry, rz);
        content.position.x = px; content.position.z = pz;
      }
      function recenterLift() {
        _measureCentre();
        content.position.x = _rcX0 - _rcC.x;
        content.position.z = _rcZ0 - _rcC.z;
        boxGroup.updateWorldMatrix(true, true);
      }
      _measureCentre(); _rcX0 = _rcC.x; _rcZ0 = _rcC.z;   // reference = closed/default state
      recenterLift();

      const foldSlider = document.getElementById("foldSlider");
      const lblOpen = document.getElementById("lblOpen");
      const lblClose = document.getElementById("lblClose");
      function paintSlider() {
        const v = +foldSlider.value;
        foldSlider.style.setProperty("--val", (v * 100) + "%");
        lblClose.classList.toggle("active", v > 0.5);
        lblOpen.classList.toggle("active", v <= 0.5);
      }
      foldSlider.addEventListener("input", () => { liftTarget = +foldSlider.value; paintSlider(); resetIdle(); });
      paintSlider();
      ["pointerdown", "mousedown", "mousemove", "touchstart", "touchmove"].forEach((type) => {
        foldSlider.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
      });

      /* ---------- drag to rotate 360° ---------- */
      let dragging = false, px = 0, py = 0;
      const rot = { x: 0.28, y: Math.PI / 6 };
      boxGroup.rotation.set(rot.x, rot.y, 0);

      function applyZoom(factor) {
        camera.position.multiplyScalar(factor);
        const dd = camera.position.length();
        if (dd < 8) camera.position.setLength(8);
        if (dd > 28) camera.position.setLength(28);
      }

      function down(cx, cy) { dragging = true; px = cx; py = cy; document.body.classList.add("grabbing"); resetIdle(); }
      function move(cx, cy) {
        if (!dragging) return;
        rot.y += (cx - px) * 0.011;
        rot.x += (cy - py) * 0.011;
        boxGroup.rotation.set(rot.x, rot.y, 0);
        px = cx; py = cy;
      }
      function up() { dragging = false; document.body.classList.remove("grabbing"); }

      addEventListener("mousedown", e => down(e.clientX, e.clientY));
      addEventListener("mousemove", e => move(e.clientX, e.clientY));
      addEventListener("mouseup", up);

      let pinchDist = 0;
      const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

      addEventListener("touchstart", e => {
        e.preventDefault();
        if (e.touches.length === 2) { dragging = false; pinchDist = dist(e.touches[0], e.touches[1]); resetIdle(); }
        else if (e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      addEventListener("touchmove", e => {
        e.preventDefault();
        if (e.touches.length === 2) {
          const dd = dist(e.touches[0], e.touches[1]);
          if (pinchDist > 0) applyZoom(1 + (pinchDist - dd) * 0.004);
          pinchDist = dd;
          resetIdle();
        } else if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      addEventListener("touchend", e => {
        if (e.touches.length < 2) pinchDist = 0;
        if (e.touches.length === 0) up();
      }, { passive: false });

      addEventListener("wheel", e => { e.preventDefault(); applyZoom(1 + e.deltaY * 0.0009); }, { passive: false });

      /* ---------- gentle auto-rotate after idle ---------- */
      let autoOn = false, idleTimer = null;
      function resetIdle() {
        autoOn = false;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { autoOn = true; }, 3000);
      }
      resetIdle();

      /* ---------- loop ---------- */
      addEventListener("message", function (e) { if (e.data === "mzk:pause") window.__mzkPaused = true; else if (e.data === "mzk:resume") window.__mzkPaused = false; });
      document.addEventListener("visibilitychange", function () { window.__mzkPaused = document.hidden; });
      (function animate() {
        requestAnimationFrame(animate);
        if (window.__mzkPaused) return;
        if (autoOn && !dragging) { rot.y += 0.003; boxGroup.rotation.y = rot.y; }
        if (Math.abs(liftTarget - lift) > 0.0005) {
          lift += (liftTarget - lift) * 0.09;
          applyLift(lift);
          recenterLift();
        }
        renderer.render(scene, camera);
      })();

      window.__debug = { THREE, boxGroup, base, lid, camera, scene,
        setLift: (t) => { liftTarget = t; lift = t; applyLift(t); recenterLift(); } };

      console.log("✓ Corrugated carry-handle carton ready");
    }
  </script>
</body>
</html>
